[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneclickqa-demo-app"
version = "1.0.0"
description = "ShopLite: intentionally buggy demo app used to test OneClickQA"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["demo_app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
