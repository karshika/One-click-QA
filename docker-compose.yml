services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      OCQA_DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # The demo app runs on the private compose network, so local targets must be
      # allowed here. Turn this off when you only test public staging sites.
      ALLOW_LOCAL_TARGETS: "true"
    ports:
      - "8000:8000"
    volumes:
      - ocqa-data:/data
    depends_on:
      - demo-app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  demo-app:
    build: ./demo-app
    ports:
      - "8001:8001"

volumes:
  ocqa-data:
