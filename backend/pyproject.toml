[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneclickqa"
version = "0.1.0"
description = "One-click QA: crawl, plan, test and report on a web app using Mistral AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "playwright>=1.47",
  "cryptography>=42",
  "jsonschema>=4.22",
  "jinja2>=3.1",
  "markdown>=3.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-Markdown",
]
schemathesis = ["schemathesis>=3.30"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/prompts/*.md", "stages/vendor/*.js", "stages/vendor/*.txt", "stages/templates/*", "stages/harness/*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "SIM108", "SIM105", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
exclude = ["data/", "build/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: real end-to-end test against demo app with a real Mistral key (skipped unless MISTRAL_API_KEY is set)",
  "browser: needs Playwright Chromium installed",
]
